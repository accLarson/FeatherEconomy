name: FeatherEconomy
version: ${project.version}
main: dev.zerek.feathereconomy.FeatherEconomy
api-version: '26.1'
authors: [ Wasted_Ticks, Zerek ]
loadbefore: [Vault]
depend:
  - Vault
commands:
  balance:
    description: View your balance and economy stats.
  deposit:
    description: Deposit lapis into your account.
  transfer:
    description: Transfer lapis from your account to another account.
  withdraw:
    description: Withdraw lapis from your account.
  managebalance:
    description: Modify another player's balance.
  lapislog:
    description: View lapis transaction history.
permissions:
  feather.economy.player:
    description: Grants access to all player-level economy commands.
    default: false
    children:
      feather.economy.balance: true
      feather.economy.deposit: true
      feather.economy.withdraw: true
      feather.economy.transfer: true
      feather.economy.lapislog: true
  feather.economy.managebalance:
    description: Manage another player's balance.
    default: op
